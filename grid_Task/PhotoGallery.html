<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
   <style>
    .container{
       
        height: 490px;
        width:630px ;
        margin-left: 33%;
        margin-top: 5%;
    }
    div{
        height: 200px;
        width: 150px;
       border: 1px solid grey;
        display: grid;
        /* grid-template-rows: repeat(4,1fr); */
        grid-template-columns:repeat(4,1fr) ;
        gap: 5px;
        
    }
   </style>
</head>
<body>
    <div class="container">
    <div>1</div>
    <div>2</div>
    <div>3</div>
    <div>4</div>
    <div>5</div>
    <div>6</div>
    <div>7</div>
    <div>8</div>
    </div>
</body>
</html>
